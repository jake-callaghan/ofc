app = "ofc"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  OFC_STATIC_DIR = "/app/frontend/dist"
  OFC_DATABASE_URL = "sqlite:////data/ofc.sqlite3"
  OFC_SQLITE_VOLUME = "/data"

[[mounts]]
  source = "ofc_local"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
