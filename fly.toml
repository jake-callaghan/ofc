app = "ofc"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  OFC_STATIC_DIR = "/app/frontend/dist"

[deploy]
  release_command = "python -m ofc.schema upgrade"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
