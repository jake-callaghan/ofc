name: CI / CD

on:
  push:
  workflow_call:

jobs:
  test-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Test frontend
        run: pnpm test

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ofc
          POSTGRES_PASSWORD: ofc_test
          POSTGRES_DB: ofc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ofc -d ofc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OFC_TEST_DATABASE_URL: postgresql://ofc:ofc_test@localhost:5432/ofc_test


    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify migrations on a blank database
        env:
          OFC_DATABASE_URL: sqlite:///data/ci-migrations.sqlite3
        run: |
          uv run --no-sync python -m ofc.schema upgrade
          uv run --no-sync python -m ofc.schema check

      - name: Verify PostgreSQL migrations
        env:
          OFC_DATABASE_URL: postgresql://ofc:ofc_test@localhost:5432/ofc_test
        run: |
          uv run --no-sync python -m ofc.schema upgrade
          uv run --no-sync python -m ofc.schema check

      - name: Test backend
        run: uv run --no-sync pytest

  deploy:
    needs: [test-frontend, test-backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
