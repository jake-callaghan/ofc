[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ofc-backend"
version = "0.1.0"
description = "Persistent multiplayer open-face Chinese poker engine"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.13,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
trained-cpu = ["sb3-contrib>=2.6,<3", "torch>=2.6,<3", "numpy>=2,<3"]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.16.7",
]

[tool.setuptools.packages.find]
include = ["ofc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF", "C4"]
